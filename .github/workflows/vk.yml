name: VK daily digest

# Раз в день постит дневную сводку курсов на стену VK-группы (данные — с боевого сайта, daily.json).
# Секреты (Settings → Secrets and variables → Actions):
#   VK_TOKEN     — токен сообщества с правом «Стена» (wall.post от имени группы). Не протухает, аккаунту не вредит.
#   VK_GROUP_ID  — числовой id сообщества (без минуса)
# 🔴 ТОЛЬКО ТЕКСТ: фото на стену требует user-токен, а «серый» Kate Mobile-токен привёл к блоку аккаунта (09-09).
# Картинка не прикрепляется намеренно (ссылка на обзор с графиками есть в тексте). Без секретов — сухой прогон.

on:
  schedule:
    - cron: "13 9 * * *"      # ~12:13 МСК (чуть позже телеграм-дайджеста)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vk-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Post daily digest to VK
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python3 vk_daily.py
