name: TG probe

# ВРЕМЕННЫЙ: на push tg_video_post.py делает один реальный пост в канал (проверка). Снять после приёмки.
on:
  push:
    paths: ['tg_video_post.py', '.github/workflows/tg-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Real post test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FORCE_NAME: "5trr__10_.mp4"
        run: python3 tg_video_post.py || true
      - name: Commit result
        run: |
          git config user.name "tg-bot"
          git config user.email "tg-bot@users.noreply.github.com"
          git add tg_result.json tg_posted.json 2>/dev/null || true
          git commit -m "ci: tg probe [skip ci]" || { echo "нет изменений"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
