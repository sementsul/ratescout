name: Cloudflare analytics digest to Telegram (my-many.ru)

on:
  push:
    branches: [main]
    paths: ['cf_analytics_tg.py']
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run digest (capture log)
        continue-on-error: true
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          CF_ZONE: "5d667f50b12ae3337cc9533f185a34f9"
        run: python3 cf_analytics_tg.py 2>&1 | tee cf-analytics-last.log
      - name: Commit log
        run: |
          git config user.name "cf-analytics-bot"
          git config user.email "cf-analytics-bot@users.noreply.github.com"
          git add cf-analytics-last.log
          git commit -m "chore(cf-analytics): лог прогона [skip ci]" || echo "no change"
          git pull --rebase --autostash || true
          git push || true
