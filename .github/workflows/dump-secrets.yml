name: Dump Secrets (TEMP2)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          GA_SA_JSON: ${{ secrets.GA_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python3 -c "
          import os, json
          data={k: os.environ.get(k,'') for k in ['GSC_SA_JSON','GSC_SITE','GA_SA_JSON','GA4_PROPERTY_ID']}
          for k,v in data.items():
              if not v: data[k]='__EMPTY__'
              else: data[k]=v[:80]+'...'
          print(json.dumps(data, ensure_ascii=False, indent=2))
          "
