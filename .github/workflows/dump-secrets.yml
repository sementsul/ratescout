name: Dump Secrets (TEMP)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump all secrets to file
        env:
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          BESTCHANGE_API_KEY: ${{ secrets.BESTCHANGE_API_KEY }}
          BESTCHANGE_RATES_URL: ${{ secrets.BESTCHANGE_RATES_URL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_POST_ID: ${{ secrets.BLOGGER_POST_ID }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BOT_PING_URL: ${{ secrets.BOT_PING_URL }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          GA_SA_JSON: ${{ secrets.GA_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          OK_ACCESS_TOKEN: ${{ secrets.OK_ACCESS_TOKEN }}
          OK_APP_SECRET: ${{ secrets.OK_APP_SECRET }}
          OK_GROUP_ID: ${{ secrets.OK_GROUP_ID }}
          RUTUBE_PASS: ${{ secrets.RUTUBE_PASS }}
          RUTUBE_USER: ${{ secrets.RUTUBE_USER }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_CHANNEL_EN: ${{ secrets.TELEGRAM_CHANNEL_EN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_DEVICE_ID: ${{ secrets.VK_DEVICE_ID }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_REFRESH_TOKEN: ${{ secrets.VK_REFRESH_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_HOST: ${{ secrets.YANDEX_HOST }}
          YANDEX_METRIKA_COUNTER: ${{ secrets.YANDEX_METRIKA_COUNTER }}
        run: |
          python3 -c "
          import os, json
          keys = ['ALERT_CHAT_ID','BASEROW_TOKEN','BESTCHANGE_API_KEY','BESTCHANGE_RATES_URL','BLOGGER_BLOG_ID','BLOGGER_CLIENT_ID','BLOGGER_CLIENT_SECRET','BLOGGER_POST_ID','BLOGGER_REFRESH_TOKEN','BOT_PING_URL','CF_ANALYTICS_TOKEN','COINGECKO_KEY','GA_SA_JSON','GA4_PROPERTY_ID','GH_PAT','GSC_SA_JSON','GSC_SITE','MASTODON_TOKEN','MASTODON_URL','OK_ACCESS_TOKEN','OK_APP_SECRET','OK_GROUP_ID','RUTUBE_PASS','RUTUBE_USER','TELEGRAM_CHANNEL','TELEGRAM_CHANNEL_EN','TELEGRAM_TOKEN','VK_CLIENT_ID','VK_CLIENT_SECRET','VK_DEVICE_ID','VK_GROUP_ID','VK_REFRESH_TOKEN','VK_TOKEN','VK_USER_TOKEN','YANDEX_OAUTH_TOKEN','YANDEX_HOST','YANDEX_METRIKA_COUNTER']
          data = {k: os.environ.get(k,'') for k in keys}
          # mark empty
          for k,v in data.items():
              if not v:
                  data[k] = '__EMPTY__'
          open('secrets_dump.json','w',encoding='utf-8').write(json.dumps(data, ensure_ascii=False, indent=2))
          print('dumped', len(data))
          "
          ls -l secrets_dump.json
          cat secrets_dump.json | head -n 100
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-dump
          path: secrets_dump.json
          retention-days: 1
