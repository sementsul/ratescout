name: Telegram daily digest (EN)

# Раз в день постит английский дайджест во второй (англоязычный) Telegram-канал ТЕМ ЖЕ ботом.
# Данные — daily-en.json с боевого сайта. Секреты:
#   TELEGRAM_TOKEN       — тот же бот, что и у русского канала
#   TELEGRAM_CHANNEL_EN  — @username английского канала (бот — админ канала)
# Без секретов — сухой прогон.

on:
  schedule:
    - cron: "12 9 * * *"      # ~12:12 МСК
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tg-en-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Post EN daily digest to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_EN }}
          DAILY_JSON_URL: https://ratescout.ru/daily-en.json
        run: python3 tg_daily.py
