name: VK clip probe

# ВРЕМЕННЫЙ: на push делает один реальный клип (форс-видео), ловит любую ошибку в vk_clip_probe.json,
# пушит с ретраями (переживает гонку с ежечасным deploy). Снять после приёмки.
on:
  push:
    paths: ['vk_clip_post.py', '.github/workflows/vk-clip-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Real clip test (capture everything)
        env:
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          FORCE_NAME: "5trr__10_.mp4"
        run: |
          python3 - <<'PY'
          import json, traceback
          out = {}
          try:
              import vk_clip_post as c
              out["videos"] = len(c.videos())
              import vk_video_post as vv
              out["has_token"] = bool(vv.TOKEN)
              out["has_group"] = bool(vv.GROUP)
              cr = vv.vk("shortVideo.create", {"group_id": vv.GROUP, "name": "RateScout",
                                               "description": vv.caption_for(0)})
              out["create"] = cr
              vids = dict(c.videos())
              path = vv.download(vids["5trr__10_.mp4"], ".mp4")
              up = c.upload_clip(path, cr["upload_url"])
              out["upload"] = up
              out["ok"] = True
          except Exception as e:                 # noqa: BLE001
              out["ok"] = False
              out["error"] = str(e)
              out["trace"] = traceback.format_exc()[-1500:]
          json.dump(out, open("vk_clip_probe.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Commit result (retry on race)
        run: |
          git config user.name "vk-clip-bot"
          git config user.email "vk-clip-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add vk_clip_probe.json || true
            git commit -m "ci: vk clip probe [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main && { echo "pushed"; break; }
            echo "push race, retry $i"; sleep 7
          done
