name: Send Blogger keys to owner (one-off)

# РАЗОВЫЙ воркер: отправляет Blogger OAuth-тройку в личный чат владельца.
# После использования УДАЛИТЬ этот файл (он не должен жить в репо).
# Запуск: только вручную (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-blogger-keys
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send keys to owner chat
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.ALERT_CHAT_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request
          tok, chat = os.environ["TG_TOKEN"], os.environ["TG_CHAT"]
          vals = {k: os.environ.get(k, "") for k in
                  ("BLOGGER_CLIENT_ID", "BLOGGER_CLIENT_SECRET", "BLOGGER_REFRESH_TOKEN")}
          missing = [k for k, v in vals.items() if not v]
          if missing:
              print("MISSING SECRETS:", ", ".join(missing))
              raise SystemExit(1)
          text = ("Blogger OAuth (ratescout-es):\n"
                  f"BLOGGER_CLIENT_ID={vals['BLOGGER_CLIENT_ID']}\n"
                  f"BLOGGER_CLIENT_SECRET={vals['BLOGGER_CLIENT_SECRET']}\n"
                  f"BLOGGER_REFRESH_TOKEN={vals['BLOGGER_REFRESH_TOKEN']}\n"
                  "Удали это сообщение после сохранения.")
          data = urllib.parse.urlencode(
              {"chat_id": chat, "text": text,
               "disable_web_page_preview": "true"}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendMessage", data=data, method="POST")
          with urllib.request.urlopen(req, timeout=30) as r:
              res = json.load(r)
          print("sent, ok:", res.get("ok"), "message_id:", (res.get("result") or {}).get("message_id"))
          EOF
