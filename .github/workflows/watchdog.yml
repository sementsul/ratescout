name: Watchdog (свежесть данных)

# Сторож автономности: раз в сутки проверяет, что ежечасный сбор курсов реально идёт.
# Смотрит возраст САМОЙ СВЕЖЕЙ точки в history.json (не generated_at — он пишется всегда;
# важно, что реально добавляются точки). Если > STALE_H часов без новых данных — сбор встал
# (истёк GH_PAT и крон заснул / сломался BestChange / падает сборка), и воркфлоу ПАДАЕТ.
# Падение scheduled-воркфлоу → GitHub шлёт владельцу письмо (Issues в репо отключены, поэтому
# канал оповещения — именно провал прогона, как и у keepalive).
#
# history.json тянем напрямую из raw (репо публичный) — без actions/checkout, чтобы у сторожа было
# минимум зависимостей, которые GitHub со временем депрекейтит (ради той самой автономности).

on:
  schedule:
    - cron: "37 5 * * *"     # ежедневно 05:37 UTC
  workflow_dispatch:
    inputs:
      stale_hours:
        description: "Порог протухания в часах (для теста тревоги поставь 0 — прогон должен упасть)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  # порог «протухания»: сбор ежечасный, 8ч = точно встал (с запасом на лаги планировщика).
  # Ручной запуск может переопределить (для проверки ветки тревоги).
  STALE_H: ${{ github.event.inputs.stale_hours || '8' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить свежесть history.json
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime as dt
          STALE_H = float(os.environ.get("STALE_H", "8"))
          URL = "https://raw.githubusercontent.com/sementsul/ratescout/main/history.json"
          try:
              with urllib.request.urlopen(URL, timeout=30) as r:
                  data = json.load(r)
          except Exception as e:
              print("::error::Watchdog: не удалось получить history.json (%s). Возможно, репо/файл недоступен." % e)
              raise SystemExit(1)
          newest = None
          for pts in data.get("series", {}).values():
              if pts:
                  k = pts[-1][0]
                  if newest is None or k > newest:
                      newest = k
          def parse(k):
              for f in ("%Y-%m-%d %H:00", "%Y-%m-%d"):
                  try:
                      return dt.datetime.strptime(k, f).replace(tzinfo=dt.timezone.utc)
                  except ValueError:
                      pass
              return None
          now = dt.datetime.now(dt.timezone.utc)
          t = parse(newest) if newest else None
          age = (now - t).total_seconds() / 3600 if t else 1e9
          print("новейшая точка: %s | возраст %.1f ч | порог %.0f ч" % (newest, age, STALE_H))
          if age > STALE_H:
              print("::error::RateScout: автосбор данных ОСТАНОВИЛСЯ. Свежайшая точка %s (возраст %.1f ч > порога %.0f ч). "
                    "Причины по частоте: (1) истёк секрет GH_PAT → крон заснул; (2) сломался источник BestChange; "
                    "(3) падает сборка/деплой. Открой вкладку Actions." % (newest, age, STALE_H))
              raise SystemExit(1)
          print("OK: данные свежие — тревог нет")
          PY
