name: Watchdog (свежесть данных)

# Сторож + САМОЛЕЧЕНИЕ. Проверяет возраст самой свежей точки в history.json.
# Частая причина застоя — GitHub задерживает/пропускает scheduled-запуски deploy (не PAT/BestChange).
# Поэтому: если данные старше HEAL_H — сторож САМ форсит сбор (workflow_dispatch deploy.yml).
# Если старше STALE_H (реальная поломка держится долго) — Telegram-алерт + красный прогон (письмо GitHub).
#
# Гоняется часто (каждые 2 часа), чтобы окно застоя было маленьким даже при троттлинге GitHub.

on:
  schedule:
    - cron: "23 */2 * * *"    # каждые 2 часа
  workflow_dispatch:
    inputs:
      heal_hours:
        description: "Порог автолечения в часах (форс deploy). По умолчанию 2."
        required: false
        default: ""
      stale_hours:
        description: "Порог тревоги в часах (ТГ + падение). По умолчанию 8."
        required: false
        default: ""

permissions:
  contents: read
  actions: write            # для workflow_dispatch deploy.yml (самолечение)

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  HEAL_H: ${{ github.event.inputs.heal_hours || '2' }}
  STALE_H: ${{ github.event.inputs.stale_hours || '8' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить свежесть history.json
        id: check
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime as dt
          HEAL_H = float(os.environ.get("HEAL_H", "2"))
          STALE_H = float(os.environ.get("STALE_H", "8"))
          URL = "https://raw.githubusercontent.com/sementsul/ratescout/main/history.json"
          try:
              with urllib.request.urlopen(URL, timeout=30) as r:
                  data = json.load(r)
          except Exception as e:
              newest, age = None, 1e9
              print("::warning::не удалось получить history.json (%s)" % e)
          else:
              newest = None
              for pts in data.get("series", {}).values():
                  if pts:
                      k = pts[-1][0]
                      if newest is None or k > newest:
                          newest = k
              def parse(k):
                  for f in ("%Y-%m-%d %H:00", "%Y-%m-%d"):
                      try:
                          return dt.datetime.strptime(k, f).replace(tzinfo=dt.timezone.utc)
                      except ValueError:
                          pass
                  return None
              now = dt.datetime.now(dt.timezone.utc)
              t = parse(newest) if newest else None
              age = (now - t).total_seconds() / 3600 if t else 1e9
          heal = age > HEAL_H
          stale = age > STALE_H
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("heal=%s\n" % ("yes" if heal else "no"))
              o.write("stale=%s\n" % ("yes" if stale else "no"))
              o.write("newest=%s\n" % (newest or "нет данных"))
              o.write("age_h=%.1f\n" % age)
          print("новейшая: %s | возраст %.1f ч | heal>%.0f=%s | alert>%.0f=%s" % (newest, age, HEAL_H, heal, STALE_H, stale))
          PY

      - name: Самолечение — форсировать сбор (deploy)
        if: steps.check.outputs.heal == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Данные старше ${HEAL_H} ч (возраст ${{ steps.check.outputs.age_h }} ч) — форсирую deploy.yml…"
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main \
            && echo "deploy.yml запущен (workflow_dispatch)." \
            || echo "::warning::не удалось запустить deploy.yml"

      - name: Telegram-алерт (если протухло сверх порога тревоги)
        if: steps.check.outputs.stale == 'yes'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.ALERT_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram не настроен — пропускаю ТГ, письмо всё равно уйдёт."
            exit 0
          fi
          MSG="🔴 RateScout: автосбор курсов протух > ${STALE_H} ч.
          Свежайшая точка: ${{ steps.check.outputs.newest }} (возраст ~${{ steps.check.outputs.age_h }} ч).
          Сторож уже форсировал deploy; если не помогло — вероятно падает сборка или кончились секреты (BestChange/токены).
          Actions: https://github.com/sementsul/ratescout/actions"
          curl -s -m 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            -o /dev/null -w "telegram sendMessage: %{http_code}\n"

      - name: Пометить сбой (письмо от GitHub + красный прогон)
        if: steps.check.outputs.stale == 'yes'
        run: |
          echo "::error::RateScout: автосбор протух > ${STALE_H} ч — свежайшая точка ${{ steps.check.outputs.newest }} (возраст ${{ steps.check.outputs.age_h }} ч). Самолечение запущено."
          exit 1

      - name: Данные свежие / вылечено
        if: steps.check.outputs.stale == 'no'
        run: echo "OK: возраст ${{ steps.check.outputs.age_h }} ч (свежайшая ${{ steps.check.outputs.newest }})."
