name: SEO audit

# Ручной аудит настройки GSC + Яндекс.Вебмастера через API (только чтение): sitemap, диагностика, зеркала.
# Ничего не меняет. Итог — в лог + сводка владельцу в Telegram. Секреты те же, что у отчётов.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet google-auth requests
      - name: Audit SEO consoles
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_HOST: ${{ secrets.YANDEX_HOST }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python3 seo_audit.py
