name: probe-ae-token

# Одноразовая проверка: подходит ли существующий CF_ANALYTICS_TOKEN (Zone·Analytics·Read)
# для запросов к Workers Analytics Engine SQL API. Удаляется после прогона.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe AE SQL API with existing zone token
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: b2f8cf47a0e945f52b3b4c3bc8dfe324
        run: |
          set +e
          echo "--- getMe/accounts (проверка токена) ---"
          curl -s -o /tmp/acc.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CF_ANALYTICS_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts"
          head -c 300 /tmp/acc.json; echo

          echo "--- AE SQL SHOW TABLES ---"
          curl -s -o /tmp/tbl.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CF_ANALYTICS_TOKEN" \
            --data "SHOW TABLES" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/analytics_engine/sql"
          head -c 500 /tmp/tbl.json; echo

          echo "--- zone analytics (заведомо должно работать) ---"
          curl -s -o /tmp/zone.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CF_ANALYTICS_TOKEN" \
            --data '{"query":"query { viewer { zones(filter:{zoneTag:\"5d667f50b12ae3337cc9533f185a34f9\"}) { httpRequests1dGroups(limit:1) { sum { requests } } } } }"}' \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/graphql"
          head -c 300 /tmp/zone.json; echo