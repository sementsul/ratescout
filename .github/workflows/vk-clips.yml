name: VK clips poster

# Раз в 2 дня публикует один ВК Клип из my-many/promo (только видео), круговая очередь, чередуя
# подпись ratescout.ru / my-many.ru. Секреты: VK_USER_TOKEN, VK_GROUP_ID, GH_PAT (коммит состояния).
# Ручной запуск с dry_run — сухой прогон.

on:
  schedule:
    - cron: "30 10 1-31/2 * *"    # ~13:30 МСК, нечётные дни
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Сухой прогон (не публиковать)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vk-clips
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Post next clip to VK
        env:
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python3 vk_clip_post.py
      - name: Commit state
        run: |
          git config user.name "vk-clip-bot"
          git config user.email "vk-clip-bot@users.noreply.github.com"
          git add vk_clip_dryrun.json 2>/dev/null || true
          git add vk_clip_posted.json 2>/dev/null || true
          git add vk_clip_result.json 2>/dev/null || true
          git commit -m "chore: vk clip state [skip ci]" || { echo "нет изменений"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
