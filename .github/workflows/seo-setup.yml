name: SEO setup
on:
  workflow_dispatch:
    inputs:
      site:
        description: "GSC-ресурс (пусто = свой из секрета)"
        required: false
        default: ""
      sitemap:
        description: "URL sitemap (пусто = свой)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet google-auth requests
      - name: Optimize consoles
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          GSC_SITE_OVERRIDE: ${{ inputs.site }}
          SITEMAP_URL: ${{ inputs.sitemap }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_HOST: ${{ secrets.YANDEX_HOST }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python3 seo_setup.py
