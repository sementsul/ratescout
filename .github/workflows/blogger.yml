name: Blogger daily digest

# Раз в день публикует сводку постом в Blogger (Google Blogger API v3). Данные — с боевого сайта (daily.json).
# Секреты: BLOGGER_CLIENT_ID, BLOGGER_CLIENT_SECRET, BLOGGER_REFRESH_TOKEN, BLOGGER_BLOG_ID.
# Без секретов — сухой прогон.

on:
  schedule:
    - cron: "20 9 * * *"      # ~12:20 МСК
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Post daily digest to Blogger
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # Пусто на первом запуске → скрипт создаст пост и напечатает id для этого секрета.
          # Задан → PATCH одного поста (обновление на месте, без новых статей).
          BLOGGER_POST_ID: ${{ secrets.BLOGGER_POST_ID }}
        # Ретрай: Blogger API иногда отвечает 503 — повторяем до 3 раз с паузой,
        # чтобы разовый сбой Google не оставлял блог без свежей сводки.
        run: |
          for i in 1 2 3; do
            if python3 blogger_daily.py; then
              exit 0
            fi
            echo "⚠ попытка $i не удалась, жду 120с..."
            sleep 120
          done
          echo "❌ публикация не удалась после 3 попыток"
          exit 1
