name: Baserow probe

# Разовая проверка интеграции с Baserow: токен читает поля, пробует создать нужные поля,
# делает тест «запись строки + чтение обратно». Результат кладёт в baserow_probe.json (читаю снаружи).
# Секрет: BASEROW_TOKEN. Триггер — изменение этого файла + ручной запуск.

on:
  push:
    paths: ['.github/workflows/baserow-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe Baserow
        env:
          T: ${{ secrets.BASEROW_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          T=os.environ.get("T","").strip(); TABLE="1182998"; BASE="https://api.baserow.io/api/database"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def req(method,url,data=None):
              h={"Authorization":"Token "+T,"Content-Type":"application/json","Accept":"application/json","User-Agent":UA}
              body=json.dumps(data).encode() if data is not None else None
              r=urllib.request.Request(url,data=body,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=30) as resp:
                      raw=resp.read().decode("utf-8","replace")
                      try: return resp.status,json.loads(raw),raw[:200]
                      except Exception: return resp.status,None,raw[:200]
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  try: return e.code,json.loads(raw),raw[:200]
                  except Exception: return e.code,None,raw[:200]
              except Exception as e:
                  return -1,{"exc":str(e)},str(e)[:200]
          out={"token_len":len(T)}
          s,fields,fraw=req("GET",f"{BASE}/fields/table/{TABLE}/")
          out["fields_http"]=s; out["fields_raw"]=fraw
          flist=fields if isinstance(fields,list) else []
          out["fields_before"]=[f.get("name") for f in flist]
          namemap={(f.get("name") or "").lower():f.get("name") for f in flist}
          out["field_names"]=[f.get("name") for f in flist]
          row={}
          for k,v in (("site","ratescout"),("source","probe-verify"),("metric","test"),("value",1)):
              if k in namemap: row[namemap[k]]=v
          if not row and flist: row[flist[0]["name"]]="probe-verify"
          ws,wr,wraw=req("POST",f"{BASE}/rows/table/{TABLE}/?user_field_names=true",row)
          out["write_http"]=ws; out["wrote"]=row; out["write_raw"]=wraw
          rs,rr,rraw=req("GET",f"{BASE}/rows/table/{TABLE}/?user_field_names=true&size=3")
          out["read_http"]=rs; out["read_count"]=rr.get("count") if isinstance(rr,dict) else None
          ds,_,_=req("DELETE",f"{BASE}/rows/table/1182943/6/")   # подчистить тестовую строку из старой таблицы
          out["cleanup_old_delete_http"]=ds
          open("baserow_probe.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name "baserow-bot"
          git config user.email "baserow-bot@users.noreply.github.com"
          git add baserow_probe.json
          git commit -m "ci: baserow probe result [skip ci]" || echo "nochange"
          git push
