name: OK probe

# Разовая проверка OK.ru (СЕССИОННЫЙ режим): подпись+session_key (users.getCurrentUser)
# и доступ к группе (group.getInfo). Пробуем обе схемы подписи (session_key в базе / нет).
# Результат в ok_probe.json (читаю снаружи). Секреты: OK_SESSION_KEY, OK_SESSION_SECRET, OK_GROUP_ID.
# Публичное: OK_APP_KEY (можно как секрет/переменную; по умолчанию зашит в ok_api.py).
# Триггер — изменение ok_api.py/этого файла + ручной запуск.

on:
  push:
    paths: ['ok_api.py', '.github/workflows/ok-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Probe OK
        env:
          OK_ACCESS_TOKEN: ${{ secrets.OK_ACCESS_TOKEN }}
          OK_APP_SECRET: ${{ secrets.OK_APP_SECRET }}
          OK_APP_KEY: ${{ secrets.OK_APP_KEY }}
          OK_GROUP_ID: ${{ secrets.OK_GROUP_ID }}
        run: |
          python3 - <<'PY'
          import json, ok_api
          out = {"has": {"token": bool(ok_api.TOKEN), "session_secret": bool(ok_api.SESSION_SECRET),
                         "app_key": ok_api.APP_KEY, "group": bool(ok_api.GROUP),
                         "token_len": len(ok_api.TOKEN)}}
          try:
              out["user"] = ok_api.call("users.getCurrentUser", fields="uid,name")
          except Exception as e:
              out["user_error"] = str(e)
          try:
              out["group"] = ok_api.call("group.getInfo", uids=ok_api.GROUP, fields="name,members_count")
          except Exception as e:
              out["group_error"] = str(e)
          json.dump(out, open("ok_probe.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      # Разовый тест реального поста (картинка ✅ / видео — по FORCE_TEST=1 при ручном запуске)
      - name: Final video post via production path
        env:
          OK_ACCESS_TOKEN: ${{ secrets.OK_ACCESS_TOKEN }}
          OK_APP_SECRET: ${{ secrets.OK_APP_SECRET }}
          OK_GROUP_ID: ${{ secrets.OK_GROUP_ID }}
          FORCE_NAME: "5trr__10_.mp4"
        run: python3 ok_video_post.py || true
      - name: Commit result
        run: |
          git config user.name "ok-bot"
          git config user.email "ok-bot@users.noreply.github.com"
          git add ok_probe.json ok_result.json 2>/dev/null || true
          git commit -m "ci: ok final video post test [skip ci]" || { echo "нет изменений"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
