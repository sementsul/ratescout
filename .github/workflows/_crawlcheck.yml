name: temp crawlcheck
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Проверка обхода + переобход + ТГ
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: |
          # 1) проверка доступности (несколько раз)
          OKC=0; for i in 1 2 3 4 5; do c=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://ratescout.ru/?p=$i"); [ "$c" = "200" ] && OKC=$((OKC+1)); done
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://ratescout.ru/")
          TIME=$(curl -s -o /dev/null -w "%{time_total}" -m 20 "https://ratescout.ru/")
          YCODE=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -A "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)" "https://ratescout.ru/")
          echo "health: $CODE ${TIME}s, ok $OKC/5, yandexUA $YCODE"
          # 2) переобход (без своей ТГ-сводки — соберём одно сообщение сами)
          RC=$(env -u TELEGRAM_TOKEN -u ALERT_CHAT_ID python3 yandex_recrawl.py 2>&1 || true)
          echo "$RC"
          SENT=$(echo "$RC" | grep -oiE 'отправлено [0-9]+' | head -1)
          # 3) сводное сообщение владельцу в ТГ
          MSG="🔎 RateScout — проверка ошибки обхода Яндекса

          Проверил доступность сайта:
          • HTTP ${CODE}, ответ за ${TIME}s
          • 5 запросов подряд: ${OKC}/5 успешных
          • с роботом Яндекса (YandexBot UA): HTTP ${YCODE}

          Вывод: сайт доступен и отвечает нормально. Ошибка «не удалось подключиться» — транзитная (кратковременный сбой на стороне GitHub Pages), не проблема настроек.

          ♻️ Отправил главную и ключевые страницы на ПЕРЕОБХОД в Яндекс.Вебмастер (${SENT:-см. лог}).
          Яндекс перепроверит доступность сам; из поиска сайт не выпадет из-за разовой ошибки."
          curl -s -m 15 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ALERT_CHAT_ID}" --data-urlencode "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n"
